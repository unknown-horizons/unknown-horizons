# -----------------------------------------------------------------------------
# Python QA and static analysis for Unknown Horizons.
# -----------------------------------------------------------------------------

name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel outdated runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

# ---------------------------------------------------------------------------------------

  python-quality:

# ---------------------------------------------------------------------------------------

    name: Python Quality
    runs-on: ubuntu-24.04
    steps:
      - name: "🤘 Checkout Code"
        uses: actions/checkout@v7

      - name: "🔽 Setup UV and Python"
        uses: astral-sh/setup-uv@v10.3.3 # https://github.com/astral-sh/setup-uv
        with:
          version: latest
          python-version: "3.13"

      - name: "📋 Detect the minimum Python version needed to run the code"
        run: |
          uv tool run vermin --no-parse-comments --eval-annotations --backport argparse --backport importlib --backport typing .

      - name: "🛠️ Check import order (ruff I001, gating)"
        run: uv tool run ruff check --select I001 horizons tests development

      # F821 (undefined name) is the only rule that reliably indicates a real
      # bug rather than style; it is clean, so it gates. The full rule set has
      # ~1200 legacy findings and is reported informationally below.
      - name: "🛠️ Lint for undefined names (ruff, gating)"
        run: uv tool run ruff check --select F821 horizons tests development

      - name: "📋 Full lint report (ruff, informational)"
        continue-on-error: true
        run: uv tool run ruff check horizons tests

      - name: "📋 Type checking (mypy, informational)"
        continue-on-error: true
        run: uv tool run mypy horizons

      - name: "🔽 Install ripgrep"
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: "❌ Forbidden code 'from __future__ import annotations' (gating)"
        run: |
          ! rg -i 'from __future__ import annotations' horizons

# ---------------------------------------------------------------------------------------

  shellcheck:

# ---------------------------------------------------------------------------------------

    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: "🤘 Checkout Code"
        uses: actions/checkout@v7 # http://github.com/actions/checkout

      - name: "🔽 Install ShellCheck"
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: "🛠️ Run ShellCheck (errors gate)"
        run: find . -type f -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -S error

      - name: "📋 Run ShellCheck (full report, informational)"
        continue-on-error: true
        run: find . -type f -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck

# ---------------------------------------------------------------------------------------

  comments-check:

# ---------------------------------------------------------------------------------------

    name: Comments check
    runs-on: ubuntu-24.04
    steps:
      - name: "🤘 Checkout Code"
        uses: actions/checkout@v7 # http://github.com/actions/checkout

      - name: "🔽 Install ripgrep"
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: "📋 Check for TODO, FIXME comments"
        continue-on-error: true
        run: rg -i '\b(?:TODO|FIXME)\b' horizons

      - name: "📋 Check for MAYBE, PROBABLY, BROKEN, WORKAROUND comments"
        continue-on-error: true
        run: rg -i '\b(?:MAYBE|PROBABLY|BROKEN|WORKAROUND)\b' horizons

# ---------------------------------------------------------------------------------------

  spell-check:

# ---------------------------------------------------------------------------------------

    name: Spell check
    runs-on: ubuntu-24.04
    steps:
      - name: "🤘 Checkout Code"
        uses: actions/checkout@v7 # http://github.com/actions/checkout

      - name: "🔽 Setup UV and Python"
        uses: astral-sh/setup-uv@v10.3.3 # https://github.com/astral-sh/setup-uv
        with:
          version: latest
          python-version: "3.13"

      - name: "Spellchecking (codespell, informational)"
        continue-on-error: true
        run: uv tool run codespell

# ---------------------------------------------------------------------------------------

  data-quality:

# ---------------------------------------------------------------------------------------

    name: Data file quality
    runs-on: ubuntu-24.04
    steps:
      - name: "🤘 Checkout Code"
        uses: actions/checkout@v7 # http://github.com/actions/checkout

      - name: "🔽 Setup UV and Python"
        uses: astral-sh/setup-uv@v10.3.3 # https://github.com/astral-sh/setup-uv
        with:
          version: latest
          python-version: "3.13"

      - name: "🔽 Install data-file validators"
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils sqlite3 gettext

      # The YAML check covers all YAML, including Weblate-generated scenarios.
      - name: "🛠️ YAML syntax and duplicate keys (gating)"
        run: |
          find . -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 \
            | xargs -0 -r uv tool run yamllint \
                -d '{rules: {key-duplicates: enable}}' --format parsable

      - name: "🛠️ XML syntax check (gating)"
        run: |
          find . -type f -name '*.xml' -print0 \
            | xargs -0 -r xmllint --noout --nonet

      - name: "🛠️ SQL scripts execute against SQLite (gating)"
        run: |
          find . -type f -name '*.sql' -print0 \
            | while IFS= read -r -d '' f; do
                sqlite3 -batch -bail :memory: < "$f" || { echo "Failed: $f"; exit 1; }
              done

      - name: "🛠️ SQLite database integrity (gating)"
        run: |
          find . -type f -name '*.sqlite' -print0 \
            | while IFS= read -r -d '' f; do
                result=$(sqlite3 "file:$f?mode=ro" 'PRAGMA quick_check;')
                if [ "$result" != "ok" ]; then
                  echo "Failed: $f -> $result"
                  exit 1
                fi
              done

      # We use msgfmt to check that translation files are parseable and have no syntax errors,
      # but we don't generate a .mo file and use /dev/null as the output.
      - name: "🛠️ PO/POT translation files parse (gating)"
        run: |
          find . -type f \( -name '*.po' -o -name '*.pot' \) -print0 \
            | while IFS= read -r -d '' f; do
                msgfmt --check-format -o /dev/null "$f" || exit 1
              done

      # Pure informational run of msgfmt to get additional information about the translation files.
      - name: "📋 Translation statistics (informational)"
        continue-on-error: true
        run: |
          find . -type f \( -name '*.po' -o -name '*.pot' \) -print0 \
            | while IFS= read -r -d '' f; do
                msgfmt --verbose --statistics -o /dev/null "$f"
              done
