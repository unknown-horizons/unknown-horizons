#
# Build and tooling configuration for Unknown Horizons (pure Python, setuptools).

[project]
name = "UnknownHorizons"
dynamic = ["version"]  # git-describe, supplied by setup.py
description = "Realtime Economy Simulation and Strategy Game"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-2.0-or-later"
license-files = ["doc/LICENSE"]
authors = [
  { name = "The Unknown Horizons Team", email = "team@unknown-horizons.org" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Real Time Strategy",
]
dependencies = [
  "crayons>=0.4.0",
  "distro>=1.9.0",
  "greenlet>=3.0.3",
  "Pillow>=11.0.0",
  "polib>=1.2.0",
  "pyyaml>=6.0.2",
  # TODO: add "libfife>=<version>" once libfife is published to PyPI
]

# TODO: declare entry points?
#[project.scripts]
#unknown-horizons = "run_uh:main"

[project.urls]
Homepage = "https://www.unknown-horizons.org"
Repository = "https://github.com/unknown-horizons/unknown-horizons"
Tracker = "https://github.com/unknown-horizons/unknown-horizons/issues"

[build-system]
requires = [
  "setuptools>=61",
  "distro>=1.9.0",  # setup.py imports it at build time to pick the install prefix
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "ruff>=0.11.0",
  "mypy>=1.10",
]
test = [
  "coverage>=7.6",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",   # provides the `mocker` fixture used across the suite
  "coveralls>=3.3",      # publishes the combined coverage report from CI
  "setuptools>=61",      # required by setup.py build_i18n
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "build",
  "out",
  "content/gfx",                  # generated atlases
  "horizons/gui/translations.py", # generated
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
]
ignore = [
  "W191",  # tab-indentation: .editorconfig intentionally uses tabs
  "E101",  # mixed-spaces-and-tabs
  "E501",  # line-too-long: not enforced; the codebase has long data tables
]

[tool.ruff.lint.per-file-ignores]
"horizons/constants.py" = ["E501"]
"horizons/ext/*" = ["F401", "F403", "F405"]  # re-export modules
"horizons/gui/translations.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["horizons", "tests"]
known-third-party = ["fife", "pytest"]
combine-as-imports = true

# TODO: the codebase is not type-clean yet
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "skip"
warn_no_return = false
check_untyped_defs = false # Enable after fixing existing errors

[tool.coverage.run]
branch = true
parallel = true  # On CI the GUI and non-GUI runs are combined into one report
source = ["horizons"]
include = ["horizons/*", "run_uh.py", "run_server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "long: mark test as long-running (only with --long-tests)",
  "gui_test: mark test as a GUI test (only with --gui-tests)",
]

[tool.codespell]
check-hidden = true
check-filenames = true
skip = [
    "__pycache__",
    ".*_cache",
    "./development/extract_strings_from_objects.py",
    "./development/pre-commit",
    ".codespellrc",
    ".git",
    ".github",
    ".venv",
    "*.pdf",
    "build",
    "content",
    "dist",
    "install",
    "po",
]
ignore-words-list = "indx,unparseable,ore"
